{% set name = "duckdb" %}
{% set version = "1.5.5" %}

package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
    # (!!) Please also update the git used for OVERRIDE_GIT_DESCRIBE in the build scripts.
  - url: https://github.com/duckdb/duckdb/archive/refs/tags/v{{ version }}.tar.gz
    sha256: f33155ff962e6e1e08fd1e9caffa487d4325aa60999e2eabc76feff534d6558b
    patches:
      - patches/0001-Dynamically-link-the-cli.patch
      - patches/0002-Make-extensions-prefix-free.patch
      - patches/0006-Install-.h-headers.patch

build:
  number: 1
  skip: true  # [win and x86_64]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja
    - python *  # [win]
  host:
    - icu
    - openssl
    - libcurl
    - croaring

outputs:
  - name: libduckdb
    script: install-lib.sh  # [unix]
    script: install-lib.bat  # [win]
    build:
      run_exports:
        - {{ pin_subpackage("libduckdb", max_pin="x.x.x") }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - openssl
        - icu
    test:
      commands:
        - test -f $PREFIX/lib/libduckdb${SHLIB_EXT}  # [unix]
        - if not exist %LIBRARY_BIN%\duckdb.dll exit 1  # [win]
        - powershell -ExecutionPolicy Bypass -File "%RECIPE_DIR%\test-pe.ps1" "%LIBRARY_BIN%\duckdb.dll"  # [win]
  - name: libduckdb-devel
    script: install-headers.sh  # [unix]
    script: install-headers.bat  # [win]
    build:
      run_exports:
        - {{ pin_subpackage("libduckdb", max_pin="x.x.x") }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - {{ pin_subpackage("libduckdb", exact=True) }}
      run:
        - {{ pin_subpackage("libduckdb", exact=True) }}
    test:
      commands:
        - test -f $PREFIX/include/duckdb.h  # [unix]
        - test -f $PREFIX/include/duckdb/common/adbc/adbc.h  # [unix]
        - if not exist %LIBRARY_INC%\duckdb.h exit 1  # [win]
        - if not exist %LIBRARY_INC%\duckdb\common\adbc\adbc.h exit 1  # [win]
        - if not exist %LIBRARY_LIB%\duckdb.lib exit 1  # [win]
        - call "%RECIPE_DIR%\test-consumer.bat"  # [win]
      requires:
        - {{ compiler('c') }}  # [win]
  - name: duckdb-cli
    script: install-cli.sh  # [unix]
    script: install-cli.bat  # [win]
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ stdlib("c") }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - {{ pin_subpackage("libduckdb", exact=True) }}
      run:
        - {{ pin_subpackage("libduckdb", exact=True) }}
    test:
      commands:
        - duckdb -version
        - {{ RECIPE_DIR }}/test-builtin-extensions.sh  # [unix]
        - powershell -ExecutionPolicy Bypass -File "%RECIPE_DIR%\test-builtin-extensions.ps1"  # [win]
        - powershell -ExecutionPolicy Bypass -File "%RECIPE_DIR%\test-pe.ps1" "%LIBRARY_BIN%\duckdb.exe"  # [win]
      requires:
        - jq  # [unix]
  - name: duckdb-extension-json
    script: noop.sh  # [unix]
    script: noop.bat  # [win]
    # Empty placeholder package as this now built-in
    # We need to use the same dependencies as in the main build to make it work in cross-compilation
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - cmake
        - ninja
        - macholib
      host:
        - {{ pin_subpackage("libduckdb", exact=True) }}
      run:
        - {{ pin_subpackage("libduckdb", exact=True) }}
    test:
      commands:
        - exit 0  # [unix]
        - exit /b 0  # [win]
  - name: duckdb-extension-autocomplete
    script: noop.sh  # [unix]
    script: noop.bat  # [win]
    # Empty placeholder package as this now built-in
    # We need to use the same dependencies as in the main build to make it work in cross-compilation
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - cmake
        - ninja
        - macholib
      host:
        - {{ pin_subpackage("libduckdb", exact=True) }}
      run:
        - {{ pin_subpackage("libduckdb", exact=True) }}
    test:
      commands:
        - exit 0  # [unix]
        - exit /b 0  # [win]
  - name: duckdb-extension-tpcds
    build:
      binary_relocation: false
    script: install-extension.sh  # [unix]
    script: install-extension.bat  # [win]
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - cmake
        - ninja
        - python *
        - macholib
      host:
        - {{ pin_subpackage("libduckdb", exact=True) }}
      run:
        - {{ pin_subpackage("libduckdb", exact=True) }}
    test:
      commands:
        - {{ RECIPE_DIR }}/test-extension.sh  # [unix]
        - powershell -ExecutionPolicy Bypass -File "%RECIPE_DIR%\test-extension.ps1" tpcds  # [win]
      requires:
        - duckdb-cli
        - jq  # [unix]
  - name: duckdb-extension-httpfs
    script: install-extension.sh  # [unix]
    script: install-extension.bat  # [win]
    build:
      binary_relocation: false
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - cmake
        - ninja
        - python *
        - macholib
      host:
        - {{ pin_subpackage("libduckdb", exact=True) }}
        - openssl
        - libcurl
      run:
        - {{ pin_subpackage("libduckdb", exact=True) }}
    test:
      commands:
        - {{ RECIPE_DIR }}/test-extension.sh  # [unix]
        - powershell -ExecutionPolicy Bypass -File "%RECIPE_DIR%\test-extension.ps1" httpfs  # [win]
      requires:
        - duckdb-cli
        - jq  # [unix]
  - name: duckdb-extension-fts
    script: install-extension.sh  # [unix]
    script: install-extension.bat  # [win]
    build:
      binary_relocation: false
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - cmake
        - ninja
        - python *
        - macholib
      host:
        - {{ pin_subpackage("libduckdb", exact=True) }}
        - openssl
      run:
        - {{ pin_subpackage("libduckdb", exact=True) }}
    test:
      commands:
        - {{ RECIPE_DIR }}/test-extension.sh  # [unix]
        - powershell -ExecutionPolicy Bypass -File "%RECIPE_DIR%\test-extension.ps1" fts  # [win]
      requires:
        - duckdb-cli
        - jq  # [unix]
  - name: duckdb-extension-tpch
    build:
      binary_relocation: false
    script: install-extension.sh  # [unix]
    script: install-extension.bat  # [win]
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - cmake
        - ninja
        - python *
        - macholib
      host:
        - {{ pin_subpackage("libduckdb", exact=True) }}
      run:
        - {{ pin_subpackage("libduckdb", exact=True) }}
    test:
      commands:
        - {{ RECIPE_DIR }}/test-extension.sh  # [unix]
        - powershell -ExecutionPolicy Bypass -File "%RECIPE_DIR%\test-extension.ps1" tpch  # [win]
      requires:
        - duckdb-cli
        - jq  # [unix]
  - name: duckdb-extension-ducklake
    build:
      binary_relocation: false
    script: install-extension.sh  # [unix]
    script: install-extension.bat  # [win]
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - cmake
        - ninja
        - python *
        - macholib
      host:
        - {{ pin_subpackage("libduckdb", exact=True) }}
        - croaring
      run:
        - {{ pin_subpackage("libduckdb", exact=True) }}
        - croaring
    test:
      commands:
        - {{ RECIPE_DIR }}/test-extension.sh  # [unix]
        - powershell -ExecutionPolicy Bypass -File "%RECIPE_DIR%\test-extension.ps1" ducklake  # [win]
      requires:
        - duckdb-cli
        - jq  # [unix]

about:
  home: https://www.duckdb.org/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: An Embeddable Analytical Database
  description: |
    DuckDB is an embedded database designed to execute analytical SQL queries
    fast while embedded in another process. It is designed to be easy to
    install and easy to use.
  doc_url: https://duckdb.org/docs/index.html
  dev_url: https://github.com/duckdb/duckdb

extra:
  recipe-maintainers:
    - xhochy
    - janjagusch
    - flaviomartins
